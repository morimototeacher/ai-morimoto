<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>再結晶シミュレーション</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f5;font-family:"Yu Gothic",Meiryo,sans-serif;color:#222;overflow-x:hidden}
.app{max-width:1440px;margin:auto;padding:10px}
.title{font-size:28px;font-weight:700;margin:0 0 8px}
.card{background:#fff;border:1px solid #ccc;padding:10px}
.main{
  display:grid;
  grid-template-columns:minmax(520px,1.35fr) minmax(360px,.95fr) minmax(250px,.7fr);
  gap:12px;
  align-items:start
}
.panel{min-width:0}
.panel h2{font-size:22px;margin:0 0 6px;text-align:center}
canvas{display:block;width:100%;height:auto}
.graphPanel,.scenePanel,.ctrl{border:1px solid #ddd;background:#fff}
.graphPanel,.scenePanel{padding:8px}
.ctrl{padding:10px}
.fixed{line-height:1.65;font-size:18px;margin-bottom:8px}
.tempLabel{text-align:center;font-size:18px}
.temp{font-size:38px;font-weight:700;text-align:center;line-height:1.1}
.slider{width:100%;margin:8px 0 10px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font-size:16px;padding:8px 6px;border:1px solid #999;background:#eee;cursor:pointer;border-radius:3px}
button.dark{background:#444;color:#fff}
.status{background:#f4f4f4;border:1px solid #ddd;padding:8px;margin-top:8px;line-height:1.55;font-size:16px;min-height:92px}
.legend{text-align:center;font-size:20px;margin-top:4px}
.dot{display:inline-block;width:20px;height:3px;vertical-align:middle;margin:0 5px 0 12px}
.red{background:#d43838}.blue{background:#2176c7}
.note{font-size:18px;color:#666;margin-top:5px;line-height:1.4}
.particleLegend{
  display:flex;justify-content:center;gap:28px;align-items:center;
  margin:2px 0 8px;padding:8px 6px;background:#f4f4f4;border:1px solid #ddd;
  font-size:18px
}
.particleItem{display:flex;align-items:center;gap:8px;white-space:nowrap}
.particleCircle{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid #777}
.particleCircle.kno3{background:#bdbdbd}
.particleCircle.cuso4{background:#2176c7}
.filterPanel{display:none;border:1px solid #ddd;background:#fff;padding:8px}
.filterPanel.show{display:block}
@media(max-width:1050px){
  .main{grid-template-columns:1fr 1fr}
  .ctrl{grid-column:1/-1}
}
@media(max-width:760px){
  body{overflow:auto}.main{grid-template-columns:1fr}
  .ctrl{grid-column:auto}
}
</style>
</head>
<body>
<div class="app">
  <div class="title">再結晶（析出の原理）</div>
  <div class="card">
    <div class="main">
      <div class="panel graphPanel">
        <h2>溶解度曲線</h2>
        <canvas id="graph" width="760" height="540"></canvas>
        <div class="legend"><span class="dot red"></span>硝酸カリウム <span class="dot blue"></span>硫酸銅</div>
        <div class="note">縦軸：水5 mLに溶ける溶質の質量（g）</div>
      </div>

      <div class="panel scenePanel" id="scenePanel">
        <h2>ビーカーの様子</h2>
        <div class="particleLegend">
          <span class="particleItem"><span class="particleCircle kno3"></span><b>硝酸カリウム</b></span>
          <span class="particleItem"><span class="particleCircle cuso4"></span><b>硫酸銅</b></span>
        </div>
        <canvas id="scene" width="520" height="510"></canvas>
      </div>

      <div class="panel filterPanel" id="filterPanel">
        <h2>ろ過</h2>
        <canvas id="filter" width="520" height="510"></canvas>
      </div>

      <div class="ctrl">
        <div class="fixed">
          <b>水：</b>5 mL（固定）<br>
          <b>硝酸カリウム：</b>2.7 g（固定）<br>
          <b>硫酸銅：</b>0.3 g（固定）
        </div>

        <div class="tempLabel">温度</div>
        <div class="temp"><span id="tv">20</span> ℃</div>
        <input class="slider" id="temp" type="range" min="0" max="100" value="20" step="1">

        <div class="buttons">
          <button class="dark" onclick="filterSim()">ろ過する</button>
          <button onclick="showBeaker()">ビーカー表示</button>
          <button onclick="resetSim()">リセット</button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const K=[[0,13.3],[10,20.9],[20,31.6],[30,45.8],[40,63.9],[50,85.5],[60,110],[70,138],[80,169],[90,202],[100,246]];
const C=[[0,14.3],[10,17.4],[20,20.7],[30,25],[40,29],[50,34],[60,40],[70,47],[80,55],[90,65],[100,75]];
const te=document.getElementById('temp'),tv=document.getElementById('tv');
const sc=document.getElementById('scene').getContext('2d');
const gc=document.getElementById('graph').getContext('2d');
const fc=document.getElementById('filter').getContext('2d');
const status=document.getElementById('status');
let phase=0, filtered=false;

function val(a,t){
  for(let i=0;i<a.length-1;i++){
    if(t<=a[i+1][0]){
      let A=a[i],B=a[i+1];
      return A[1]+(B[1]-A[1])*(t-A[0])/(B[0]-A[0]);
    }
  }
  return a[a.length-1][1];
}
function calc(){
  let t=+te.value,kcap=val(K,t)*.05,ccap=val(C,t)*.05;
  return{
    t,
    kD:Math.min(2.7,kcap),
    cD:Math.min(.3,ccap),
    kS:Math.max(0,2.7-kcap),
    cS:Math.max(0,.3-ccap)
  };
}
function go(t){
  te.value=t;filtered=false;showBeaker();draw();
}
function resetSim(){go(20)}
function showBeaker(){
  document.getElementById('filterPanel').classList.remove('show');
  document.getElementById('scenePanel').style.display='block';
  filtered=false;
}
function filterSim(){
  filtered=true;
  document.getElementById('scenePanel').style.display='none';
  document.getElementById('filterPanel').classList.add('show');
  drawFilter(calc());
  updateStatus(calc());
}
function drawScene(s){
  sc.clearRect(0,0,520,510);
  sc.fillStyle="#fafafa";sc.fillRect(0,0,520,510);

  let bx=95,by=70,bw=300,bh=350;
  sc.strokeStyle="#555";sc.lineWidth=4;
  sc.beginPath();
  sc.moveTo(bx,by);sc.lineTo(bx+14,by+bh);
  sc.quadraticCurveTo(bx+bw/2,by+bh+18,bx+bw-14,by+bh);
  sc.lineTo(bx+bw,by);sc.stroke();

  sc.fillStyle="rgba(87,163,230,.20)";
  sc.beginPath();sc.moveTo(bx+5,175);
  sc.lineTo(bx+13,by+bh-5);
  sc.quadraticCurveTo(bx+bw/2,by+bh+9,bx+bw-13,by+bh-5);
  sc.lineTo(bx+bw-5,175);sc.closePath();sc.fill();

  // 水に溶けている2種類の溶質を、ビーカー全体にまばらに表示。
  // 温度による速さの違いは表現せず、どの温度でも同じ速さで動く。
  const kCount=Math.max(0,Math.round(24*(s.kD/2.7)));
  const cCount=Math.max(0,Math.round(10*(s.cD/.3)));
  const tmove=performance.now()/650;

  for(let i=0;i<kCount;i++){
    let baseX=125+((i*97)%245), baseY=195+((i*71)%180);
    let px=baseX+Math.sin(tmove+i*1.7)*11;
    let py=baseY+Math.cos(tmove*.85+i*1.2)*8;
    sc.fillStyle="#bdbdbd";
    sc.beginPath();sc.arc(px,py,5,0,Math.PI*2);sc.fill();
  }
  for(let i=0;i<cCount;i++){
    let baseX=135+((i*113+37)%230), baseY=205+((i*89+29)%165);
    let px=baseX+Math.sin(tmove+i*1.9)*11;
    let py=baseY+Math.cos(tmove*.85+i*1.4)*8;
    sc.fillStyle="#2176c7";
    sc.beginPath();sc.arc(px,py,5.5,0,Math.PI*2);sc.fill();
  }

  // KNO3結晶
  let n=Math.round(52*s.kS/2.7);
  sc.strokeStyle="#fff";sc.lineWidth=5;sc.shadowColor="#555";sc.shadowBlur=2;
  for(let i=0;i<n;i++){
    let x=130+(i*53)%230,y=395-(i*21)%42;
    let a=(-60+(i*31)%120)*Math.PI/180,l=14+(i*9)%22;
    sc.beginPath();sc.moveTo(x,y);sc.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);sc.stroke();
  }
  sc.shadowBlur=0;

  // 出てきた硝酸カリウムを明示
  if(s.kS>0.01){
    sc.fillStyle="rgba(255,255,255,.92)";
    sc.strokeStyle="#777";sc.lineWidth=1.5;
    sc.fillRect(112,435,270,48);
    sc.strokeRect(112,435,270,48);
    sc.fillStyle="#222";sc.font="bold 17px sans-serif";sc.textAlign="center";
    sc.fillText("↓ 出てきた硝酸カリウムの結晶",247,456);
    sc.font="16px sans-serif";
    sc.fillText("出てきた結晶の量：約 "+s.kS.toFixed(2)+" g",247,476);
    sc.textAlign="left";
  }

  // CuSO4結晶
  let nc=Math.round(18*s.cS/.3);
  sc.fillStyle="#176fc1";
  for(let i=0;i<nc;i++){
    let x=140+(i*79)%215,y=400-(i*27)%28;
    sc.save();sc.translate(x,y);sc.rotate(.78);sc.fillRect(-5,-5,10,10);sc.restore();
  }

  sc.fillStyle="#222";sc.font="bold 24px sans-serif";
  sc.fillText(s.t+" ℃",405,95);
  sc.font="14px sans-serif";
  
}
function drawGraph(s){
  let W=760,H=540,L=125,R=28,T=24,B=78,gw=W-L-R,gh=H-T-B,ymax=13;
  gc.clearRect(0,0,W,H);gc.font="bold 25px sans-serif";
  gc.strokeStyle="#222";gc.lineWidth=1.5;
  gc.beginPath();gc.moveTo(L,T);gc.lineTo(L,H-B);gc.lineTo(W-R,H-B);gc.stroke();

  for(let t=0;t<=100;t+=10){
    let x=L+gw*t/100;
    gc.strokeStyle="#e2e2e2";gc.beginPath();gc.moveTo(x,T);gc.lineTo(x,H-B);gc.stroke();
    gc.fillStyle="#222";gc.textAlign="center";gc.fillText(t,x,H-B+22);
  }
  for(let y=0;y<=12;y+=2){
    let py=H-B-gh*y/ymax;
    gc.strokeStyle="#e2e2e2";gc.beginPath();gc.moveTo(L,py);gc.lineTo(W-R,py);gc.stroke();
    gc.fillStyle="#222";gc.textAlign="right";gc.fillText(y,L-10,py+4);
  }
  gc.textAlign="center";gc.font="bold 27px sans-serif";
  gc.fillText("温度（℃）",L+gw/2,H-15);
  gc.save();gc.translate(30,T+gh/2);gc.rotate(-Math.PI/2);
  gc.fillText("水5 mLに溶ける溶質の質量（g）",0,0);gc.restore();

  function plot(a,col){
    gc.strokeStyle=col;gc.lineWidth=3;gc.beginPath();
    for(let t=0;t<=100;t++){
      let y=val(a,t)*.05,x=L+gw*t/100,py=H-B-gh*Math.min(y,ymax)/ymax;
      t?gc.lineTo(x,py):gc.moveTo(x,py);
    }
    gc.stroke();
  }
  plot(K,"#d43838");plot(C,"#2176c7");

  // 現在温度を示す縦線
  let x=L+gw*s.t/100;
  gc.save();gc.setLineDash([4,4]);gc.strokeStyle="#222";
  gc.beginPath();gc.moveTo(x,T);gc.lineTo(x,H-B);gc.stroke();gc.restore();

  // 固定されている溶質量を表す点だけを、温度に応じて左右へ移動
  // 縦位置はそれぞれ 2.7 g / 0.3 g に固定
  const fixedPoints=[
    {y:2.7,c:"#d43838",label:"硝酸カリウム 2.7 g"},
    {y:0.3,c:"#2176c7",label:"硫酸銅 0.3 g"}
  ];
  fixedPoints.forEach(p=>{
    const py=H-B-gh*p.y/ymax;
    gc.fillStyle=p.c;
    gc.beginPath();gc.arc(x,py,7,0,Math.PI*2);gc.fill();
    gc.font="bold 22px sans-serif";
    gc.textAlign="left";
    gc.fillText(p.label,x+10,py-8);
  });
}
function drawFilter(s){
  fc.clearRect(0,0,520,510);
  fc.fillStyle="#fafafa";fc.fillRect(0,0,520,510);

  const hasCrystal = s.kS > 0.01;

  // タイトル
  fc.fillStyle="#222";fc.font="bold 22px sans-serif";fc.textAlign="center";
  if(hasCrystal){
    fc.fillText("ろ紙の上に硝酸カリウムの結晶が残る",260,38);
  }else{
    fc.fillText("硝酸カリウムの結晶は出ていない",260,38);
  }

  // funnel
  fc.strokeStyle="#555";fc.lineWidth=4;
  fc.beginPath();fc.moveTo(125,105);fc.lineTo(395,105);fc.lineTo(285,285);fc.lineTo(285,345);fc.stroke();

  // filter paper
  fc.fillStyle="#f2f2f2";fc.strokeStyle="#999";fc.lineWidth=2;
  fc.beginPath();fc.moveTo(145,118);fc.lineTo(375,118);fc.lineTo(285,268);fc.closePath();
  fc.fill();fc.stroke();

  if(hasCrystal){
    // 結晶が残る部分を目立たせる
    fc.fillStyle="rgba(255,255,255,.95)";
    fc.strokeStyle="#777";fc.lineWidth=2;
    fc.beginPath();fc.ellipse(285,180,72,30,0,0,Math.PI*2);fc.fill();fc.stroke();

    // 硝酸カリウム結晶
    fc.strokeStyle="#8a8a8a";fc.lineWidth=7;fc.lineCap="round";
    let n=Math.max(4,Math.round(24*s.kS/2.7));
    for(let i=0;i<n;i++){
      let ang=(-1.05 + ((i*37)%120)*Math.PI/180);
      let x=235+((i*31)%100), y=164+((i*17)%34);
      let len=15+((i*11)%20);
      fc.beginPath();fc.moveTo(x,y);fc.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);fc.stroke();
    }
    fc.lineCap="butt";

    // 矢印と説明
    fc.strokeStyle="#222";fc.fillStyle="#222";fc.lineWidth=3;
    fc.beginPath();fc.moveTo(90,175);fc.lineTo(205,175);fc.stroke();
    fc.beginPath();fc.moveTo(205,175);fc.lineTo(190,166);fc.lineTo(190,184);fc.closePath();fc.fill();
    fc.font="bold 20px sans-serif";fc.textAlign="left";
    fc.fillText("硝酸カリウムの結晶",28,155);
    fc.font="17px sans-serif";
    fc.fillText("ろ紙の上に残る",55,205);
  }else{
    // 結晶が出ていない場合
    fc.fillStyle="#444";fc.font="bold 20px sans-serif";fc.textAlign="center";
    fc.fillText("結晶がないため、ろ紙には何も残らない",260,190);
  }

  // receiving beaker
  fc.strokeStyle="#555";fc.lineWidth=3;fc.strokeRect(160,355,250,115);
  fc.fillStyle="rgba(60,135,220,.24)";fc.fillRect(163,414,244,53);

  fc.fillStyle="#222";fc.font="bold 18px sans-serif";fc.textAlign="center";
  fc.fillText("ろ液",285,495);

  if(hasCrystal){
    fc.font="bold 19px sans-serif";
    fc.fillText("出てきた結晶の量：約 "+s.kS.toFixed(2)+" g",285,325);
  }else{
    fc.font="bold 19px sans-serif";
    fc.fillText("出てきた結晶の量：0.00 g",285,325);
  }
}
function updateStatus(s){
  tv.textContent=s.t;
  if(!status)return;
  if(filtered){
    status.innerHTML=
      `ろ過後<br>ろ紙に残る硝酸カリウム：約 <b>${s.kS.toFixed(2)} g</b><br>`+
      `ろ紙に残る硫酸銅：約 <b>${s.cS.toFixed(2)} g</b>`;
  }else{
    status.innerHTML=
      `水溶液中<br>硝酸カリウム：<b>${s.kD.toFixed(2)} g</b><br>`+
      `硫酸銅：<b>${s.cD.toFixed(2)} g</b><br>`+
      `出てきた結晶：KNO₃ <b>${s.kS.toFixed(2)} g</b> ／ CuSO₄ <b>${s.cS.toFixed(2)} g</b>`;
  }
}
function draw(){
  let s=calc();
  drawScene(s);drawGraph(s);updateStatus(s);
  if(filtered)drawFilter(s);
}
te.addEventListener('input',()=>{filtered=false;showBeaker();draw()});
function animateParticles(){
  if(!filtered) drawScene(calc());
  requestAnimationFrame(animateParticles);
}
draw();animateParticles();
</script>
</body>
</html>
